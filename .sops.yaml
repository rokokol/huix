# Personal age key, not a host key: neither host runs sshd, so there is no
# /etc/ssh/ssh_host_ed25519_key for sops.age.sshKeyPaths to derive from
keys:
  - &rokokol age1q6v869swhlr392csqmadk346n4z9q69mktgncvztn0z5cw0ngayqnlqwvy
  # The station has a key of its own: it holds the backups of other machines and must not
  # read the secrets of the desktops
  - &station age1nds5elj7zcv5503a9t0tnstufsud99fjc7pg8mxu0ktv6c252y0sc3zyfz

creation_rules:
  # The first match wins, so this rule stands before the general one
  - path_regex: secrets/station\.yaml$
    key_groups:
      - age:
          - *rokokol
          - *station
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *rokokol
