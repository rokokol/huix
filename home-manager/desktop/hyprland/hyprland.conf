
# #######################################################################################
# HYPRLAND CONFIG (originally autogenerated, hand-edited afterwards).
# #######################################################################################

# Not every available option is set here — for the full list see the wiki:
# https://wiki.hypr.land/Configuring/
#
# The config can be split across several files and included via:
# source = ~/.config/hypr/myColors.conf

###################
### PROGRAMS    ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun -show-icons -calc-command "echo -n '{result}' | wl-copy"
$tabsNum = 4
$prevTab = $(( ( $(hyprctl activeworkspace -j | jq '.id') + $tabsNum - 2 ) % $tabsNum + 1 ))
$nextTab = $(( ( $(hyprctl activeworkspace -j | jq '.id') % $tabsNum ) + 1 ))
$getScreen = grim -g "$(slurp -b ffffff66 -w 1 && sleep 0.2)" 

#################
### AUTOSTART ###
#################
exec-once = systemctl --user start hyprpolkitagent.service 
exec-once = systemctl --user start swayosd.service 

exec-once = waybar 
exec-once = awww-daemon -q >/dev/null 2>&1 
exec-once = mako
exec-once = wl-paste --type text --watch cliphist store -max-items 500 store
exec-once = wl-paste --type image --watch cliphist store -max-items 1000 store
exec-once = hyprctl keyword cursor:no_hardware_cursors true && hyprctl keyword cursor:no_hardware_cursors false # Fixes a broken software cursor

exec = $HUIX/scripts/toggle-theme.sh --sync
exec = $HUIX/scripts/screen-shader.sh restore

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GTK_CSD,0
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

cursor {
    no_hardware_cursors = false;
}


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Permission changes require a Hyprland restart and don't apply on the fly
# (for security reasons)

# ecosystem {
#   enforce_permissions = 1
# }

permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### APPEARANCE     ###
#####################

# See https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # Border colours come from the palette, emitted in hyprland.nix before this file is sourced

    # true — resize windows by dragging their borders and gaps
    resize_on_border = false

    # Read https://wiki.hypr.land/Configuring/Tearing/ before enabling
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 7
    rounding_power = 2

    # Opacity of the active and inactive window
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 4
        render_power = 3
        # colour set in hyprland.nix
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ON,    SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# See https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "no gaps when there's a single window" — uncomment if desired
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# More: https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    preserve_split = true # usually what you want
}

# More: https://wiki.hypr.land/Configuring/Master-Layout/
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 2 # 0 or 1 — disable the mascot wallpaper
    disable_hyprland_logo = false # true — remove the random Hyprland logo / anime-girl background :(
    # If the locker died without releasing the lock (hyprlock crash), let a new instance
    # lock the session again — otherwise only a tty is left
    allow_session_lock_restore = true

    # hypridle blanks the screen on idle, but waking it back is its on-resume alone —
    # let the compositor wake on input too, so a dead hypridle can't leave a dark screen
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}


#############
### INPUT ###
#############

# Touchpad gestures, see https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace
# Two-finger pinch screen zoom (a live magnifier around the cursor). The
# mouse_up/mouse_down binds (wheel zoom below) work ONLY with a physical mouse
# wheel — on the touchpad scroll binds never fire at all, so on the laptop the
# zoom is bound to the built-in cursorZoom gesture (mode live — continuous while pinching)
gesture = 2, pinch, cursorZoom, 1, live

device {
  name = gaomon-gaomon-tablet_s630
  output = DP-1
}

xwayland {
  force_zero_scaling = true
}


###################
### BINDS         ###
###################

$mainMod = SUPER
$mainScreenMod = SUPER ALT

binds {
    scroll_event_delay = 0
}

# Core actions
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, W, exec, $menu
bind = $mainMod, F12, exec, loginctl lock-session

# Power button -> power menu (logind HandlePowerKey=ignore, see nixos/desktop/logind.nix)
bindl = , XF86PowerOff, exec, $HUIX/scripts/rofi-power.sh
bind = $mainMod, Delete, exec, $HUIX/scripts/rofi-power.sh
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, T, layoutmsg, togglesplit # in Hyprland 0.54+ togglesplit moved under layoutmsg
bind = $mainMod, F, fullscreen, 0 # 1 — fullscreen mode (keeps the bars), 0 — full fullscreen
bind = $mainMod, Z, exec, pidof waybar && pkill waybar || waybar
bind = $mainMod, Y, exec, rofi -show dictionary -modi "dictionary:$HUIX/scripts/rofi-wooordhunt.sh"
bind = $mainMod, U, exec, rofi -modi "ru-en:$HUIX/scripts/rofi-libre.sh ru en,en-ru:$HUIX/scripts/rofi-libre.sh en ru" -show ru-en 
bind = $mainMod, B, exec, $HUIX/scripts/rofi-clipboard.sh
bind = $mainMod, N, exec, $HUIX/scripts/rofi-notify.sh
bind = $mainMod SHIFT, N, exec, $HUIX/scripts/notify-center.sh dnd toggle
bind = $mainMod, A, exec, $HUIX/scripts/toggle-theme.sh
# SHIFT+G — picker: each choice ADDS an effect to the stack (composition).
# G — clear the whole stack (effects stack until cleared here or via "Normal")
bind = $mainMod, G, exec, $HUIX/scripts/screen-shader.sh effect clear
bind = $mainMod SHIFT, G, exec, $HUIX/scripts/rofi-shader.sh
bindel = $mainMod CTRL, bracketright, exec, $HUIX/scripts/screen-shader.sh bright up
bindel = $mainMod CTRL, bracketleft, exec, $HUIX/scripts/screen-shader.sh bright down
bind = $mainMod CTRL, BackSpace, exec, $HUIX/scripts/screen-shader.sh bright reset
bind = $mainMod SHIFT, B, exec, rofi -show emoji -modi "emoji:rofimoji --action copy --files emojis_smileys_emotion emojis_people_body emojis_animals_nature emojis_food_drink emojis_activities emojis_travel_places emojis_objects emojis_symbols emojis_flags dingbats miscellaneous_symbols_and_pictographs,math:rofimoji --action copy --files math mathematical_operators arrows geometric_shapes greek_and_coptic,chars:rofimoji --action copy --files currency_symbols letterlike_symbols latin-1_supplement general_punctuation superscripts_and_subscripts enclosed_alphanumerics box_drawing cjk_symbols_and_punctuation nerd_font,kaomoji:rofimoji --action copy --files kaomoji"

# Screenshots / screen operations
bind = $mainScreenMod, S, exec, $getScreen - | GTK_THEME=Adwaita:light satty -f -
bind = $mainScreenMod, C, exec, $HUIX/scripts/shot-copy.sh region
bind = $mainScreenMod, A, exec, $HUIX/scripts/pin-screen.sh
bind = $mainScreenMod, P, exec, $HUIX/scripts/colorpicker.sh
bind = $mainScreenMod, T, exec, $HUIX/scripts/ocr.sh rus+eng
bind = $mainScreenMod, R, exec, $HUIX/scripts/ocr.sh rus
bind = $mainScreenMod, E, exec, $HUIX/scripts/ocr.sh eng
bind = $mainScreenMod, M, exec, $HUIX/scripts/shot-copy.sh full

# Magnifier / screen zoom with the mouse wheel (ALT+WIN+wheel) — physical wheel only;
# on the touchpad the "pinch" gesture works instead (gesture cursorZoom above)
bind = $mainScreenMod, mouse_down, exec, $HUIX/scripts/zoom.sh out 
bind = $mainScreenMod, mouse_up, exec, $HUIX/scripts/zoom.sh in 
bind = $mainScreenMod, BackSpace, exec, $HUIX/scripts/zoom.sh reset

# --- NAVIGATION (FOCUS) ---
# Move focus (HJKL)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move focus (ARROWS)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- MOVING WINDOWS ---
# Move the windows themselves (HJKL) + Shift
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Move the windows themselves (ARROWS) + Shift
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Precise movement of the active window (for floating ones)
binde = $mainMod CTRL, left, moveactive, -80 0
binde = $mainMod CTRL, right, moveactive, 80 0
binde = $mainMod CTRL, up, moveactive, 0 -80
binde = $mainMod CTRL, down, moveactive, 0 80

# Same for HJKL
binde = $mainMod CTRL, h, moveactive, -80 0
binde = $mainMod CTRL, l, moveactive, 80 0
binde = $mainMod CTRL, k, moveactive, 0 -80
binde = $mainMod CTRL, j, moveactive, 0 80

# --- WORKSPACES ---
# Switch workspaces [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
# bind = $mainMod, 0, workspace, 10

# Move a window to workspace [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Mouse
bind = $mainMod, mouse_down, exec, hyprctl dispatch workspace $nextTab
bind = $mainMod, mouse_up,exec, hyprctl dispatch workspace $prevTab
bind = $mainMod SHIFT, mouse_down, exec, hyprctl dispatch movetoworkspace $nextTab
bind = $mainMod SHIFT, mouse_up, exec, hyprctl dispatch movetoworkspace $prevTab

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys and brightness
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute,     exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Player controls
bindl = , XF86AudioNext,  exec, playerctl -p playerctld next
bindl = , XF86AudioPrev,  exec, playerctl -p playerctld previous
bindl = , XF86AudioPlay,  exec, playerctl -p playerctld play-pause
bindl = , XF86AudioPause, exec, playerctl -p playerctld play-pause

# Resize the active window
binde = SUPER ALT, L, resizeactive, 40 0
binde = SUPER ALT, H, resizeactive, -40 0
binde = SUPER ALT, K, resizeactive, 0 -40
binde = SUPER ALT, J, resizeactive, 0 40

binde = SUPER ALT, right, resizeactive, 40 0
binde = SUPER ALT, left, resizeactive, -40 0
binde = SUPER ALT, up, resizeactive, 0 -40
binde = SUPER ALT, down, resizeactive, 0 40

# Window rules: https://wiki.hypr.land/Configuring/Window-Rules/
# Workspace rules: https://wiki.hypr.land/Configuring/Workspace-Rules/

# Useful window rules

windowrule {
    # Ignore maximize requests from all apps — usually more convenient this way
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix drag-and-drop issues under XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Window rule for hyprland-run
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# layerrule {
#     name = no_anim_for_selection
#     no_anim = on
#     match:namespace = selection
# }

layerrule {
    name = no_anim_for_hyprpicker
    no_anim = on
    match:namespace = ^(hyprpicker)$
}

# Fix for invisible drag windows (they usually have an empty title)
windowrule {
    name = ue4-drag-empty-fix
    match:class = ^(UE4Editor|UnrealEditor)$
    match:title = ^$
    
    no_initial_focus = true
    no_focus = true
}

windowrule {
    name = float-dialect
    match:class = ^(app.drey.Dialect)$
    float = yes
}

# pin-screen.sh: the window class starts with desktop-pin, matched by prefix.
# Floating + on top; the script sets the exact geometry via hyprctl
windowrule {
    name = float-desktop-pin
    match:class = ^(desktop-pin).*$
    float = yes
    pin = yes
}

# Wayland gives the compositor no "this is a dialog" hint (match:modal reads the
# XWayland flag only), so dialogs are floated by hand. Everything routed through
# the portal — GTK4/Chromium/Electron file choosers — shares this one class
windowrule {
    name = float-portal-dialogs
    match:class = ^(xdg-desktop-portal-gtk)$
    float = yes
}

# xarchiver builds its file choosers in-process, so they share the app class —
# nothing tells them apart from the main window, float the whole app.
# Spawn under the cursor instead of the monitor centre, clamped to stay on screen
windowrule {
    name = float-xarchiver
    match:class = ^(xarchiver)$
    float = yes
    move = min(max(cursor_x-window_w,0),monitor_w-window_w) min(max(cursor_y-window_h,0),monitor_h-window_h)
}

layerrule = blur on, match:namespace waybar
layerrule = animation slide, match:namespace waybar
