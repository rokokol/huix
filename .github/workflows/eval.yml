name: eval

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by update-lock.yml against its temp branch, so the lock bump is checked by this
  # file rather than by a copy of its commands
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # The matrix below reads the host list from the flake, so a new host is evaluated without an
  # edit here
  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # A separate assignment, because a failed command substitution inside echo leaves the
      # step green with an empty list
      - id: list
        run: |
          hosts=$(nix eval --no-write-lock-file --json .#nixosConfigurations --apply builtins.attrNames)
          echo "hosts: $hosts"
          echo "hosts=$hosts" >>"$GITHUB_OUTPUT"

  eval:
    needs: hosts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Eval, not build: ollama-cuda misses every cache and always compiles, so a
      # full build of nixos-pc cannot finish on a hosted runner
      - name: Evaluate ${{ matrix.host }}
        run: |
          nix eval --no-write-lock-file \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Evaluates every host again — this time through the flake's own outputs, so the
      # formatter and the checks are validated too — and builds the generated init.lua,
      # which nixvim runs stylua over: broken Lua in any module fails here and nowhere else
      - run: nix flake check --no-write-lock-file

      - run: nix fmt -- --ci

      # nix flake check above already runs checks.nix-lint, which is the same checker in a
      # build sandbox. That sandbox has no network, so it leaves out the rules that need
      # this flake's inputs, and it sees no git repository, so it checks no file name.
      # This step is the whole checker, from the revision flake.lock pins
      - name: check-nix, including the rules the sandbox cannot reach
        run: nix run .#check-nix -- -N rokokol
