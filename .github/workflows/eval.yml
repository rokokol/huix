name: eval

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by update-lock.yml against its temp branch, so the lock bump is checked by this
  # file rather than by a copy of its commands
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [nixos-pc, nixos-laptop]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Eval, not build: ollama-cuda misses every cache and always compiles, so a
      # full build of nixos-pc cannot finish on a hosted runner
      - name: Evaluate ${{ matrix.host }}
        run: |
          nix eval --no-write-lock-file \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Evaluates both hosts again — this time through the flake's own outputs, so the
      # formatter and the checks are validated too — and builds the generated init.lua,
      # which nixvim runs stylua over: broken Lua in any module fails here and nowhere else
      - run: nix flake check --no-write-lock-file

      - run: nix fmt -- --ci

      # The palette is one node only because every ddlc-* input follows it. A forgotten
      # follows shows up as a suffixed second node and nothing else — the colours then
      # diverge silently, which is the one thing a single source of truth exists to prevent
      - name: exactly one ddlc-palette in the lock
        run: |
          python3 - <<'EOF'
          import json, sys
          nodes = [k for k in json.load(open("flake.lock"))["nodes"] if k.startswith("ddlc-palette")]
          if nodes != ["ddlc-palette"]:
              sys.exit(f"the lock holds {nodes} — an input is missing its ddlc-palette.follows")
          EOF
