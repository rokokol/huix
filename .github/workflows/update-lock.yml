name: update-lock

# flake.lock ages on its own and nothing else here moves it: dependabot watches only the uses:
# pins. This takes every input's current revision weekly, runs the very same checks a push runs
# — eval.yml itself, not a copy of its commands — and lands the bump only if they pass. The
# point is the laptop: it is booted rarely, and a lock nobody has moved in a month is what makes
# that first rebuild long. What this cannot do is build the closure — nixos-laptop's toplevel is
# 40.8 GiB against a runner's 14, so "green" here means both hosts evaluate, not that they build
#
# 07:00 is the tail of the family cascade: ddlc-palette takes nixpkgs at 05:00, every repo that
# pins the palette bumps it at 06:00, and only then does this take the tree. The palette this
# config builds against comes from the node locked below either way — every ddlc-* input carries
# inputs.ddlc-palette.follows — so what the hour buys is that each sibling has already been
# checked against the new palette before its revision arrives here
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Two runs would push the same branch from different bases
concurrency: update-lock

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      moved: ${{ steps.push.outputs.moved }}
    steps:
      # Full history: pushing from a shallow clone is refused
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - id: push
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "every input is already current"
            echo "moved=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch=flake-lock/$(date -u +%Y-%m-%d)
          git switch -c "$branch"
          git commit -qam "take every input's current revision"
          git push -f origin "$branch"
          echo "branch=$branch" >>"$GITHUB_OUTPUT"
          echo "moved=1" >>"$GITHUB_OUTPUT"

  # The whole point of the temp branch: a reusable workflow checks out a ref, so the bump has
  # to exist somewhere before the checks can see it
  verify:
    needs: bump
    if: needs.bump.outputs.moved == '1'
    uses: ./.github/workflows/eval.yml
    with:
      ref: ${{ needs.bump.outputs.branch }}

  # Red leaves the branch alone, with the bump on it, so the failure can be looked at
  land:
    needs: [bump, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.branch }}
          fetch-depth: 0
      - name: rebase the verified bump onto master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin master
          # sync.sh pushes after every nixos-rebuild, so master has usually moved since the
          # bump was taken. The commit touches flake.lock alone: a conflict means the lock was
          # bumped by hand too, and stopping is the right answer. What lands is then the
          # rebased tree rather than the byte-identical one the checks saw
          git rebase origin/master
          git push origin HEAD:master
          git push origin --delete "${{ needs.bump.outputs.branch }}"
